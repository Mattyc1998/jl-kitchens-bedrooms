<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Navy blue shaker kitchen with brass hardware and pendant lighting, Cheshire</title>
  <desc id="heroDesc">Placeholder photography — swap for real installation photo</desc>
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C2E52"/>
      <stop offset="1" stop-color="#0D1730"/>
    </linearGradient>
    <linearGradient id="heroFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A3B60"/>
      <stop offset="1" stop-color="#12203D"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#heroBg)"/>
  <rect y="740" width="1600" height="260" fill="url(#heroFloor)"/>
  <!-- run of shaker cabinet doors -->
  <g stroke="#0A1226" stroke-width="3">
    <g fill="#243c68">
      <rect x="60" y="360" width="220" height="380" rx="4"/>
      <rect x="300" y="360" width="220" height="380" rx="4"/>
      <rect x="540" y="360" width="220" height="380" rx="4"/>
      <rect x="780" y="360" width="220" height="380" rx="4"/>
      <rect x="1020" y="360" width="220" height="380" rx="4"/>
      <rect x="1260" y="360" width="220" height="380" rx="4"/>
    </g>
    <g fill="none" stroke="#3a5590" stroke-width="2">
      <rect x="90" y="390" width="160" height="150"/>
      <rect x="90" y="560" width="160" height="150"/>
      <rect x="330" y="390" width="160" height="150"/>
      <rect x="330" y="560" width="160" height="150"/>
      <rect x="570" y="390" width="160" height="150"/>
      <rect x="570" y="560" width="160" height="150"/>
      <rect x="810" y="390" width="160" height="150"/>
      <rect x="810" y="560" width="160" height="150"/>
      <rect x="1050" y="390" width="160" height="150"/>
      <rect x="1050" y="560" width="160" height="150"/>
      <rect x="1290" y="390" width="160" height="150"/>
      <rect x="1290" y="560" width="160" height="150"/>
    </g>
  </g>
  <!-- brass handles -->
  <g fill="#B08D4F">
    <circle cx="260" cy="465" r="6"/>
    <circle cx="260" cy="635" r="6"/>
    <circle cx="500" cy="465" r="6"/>
    <circle cx="500" cy="635" r="6"/>
    <circle cx="740" cy="465" r="6"/>
    <circle cx="740" cy="635" r="6"/>
    <circle cx="980" cy="465" r="6"/>
    <circle cx="980" cy="635" r="6"/>
    <circle cx="1220" cy="465" r="6"/>
    <circle cx="1220" cy="635" r="6"/>
    <circle cx="1460" cy="465" r="6"/>
    <circle cx="1460" cy="635" r="6"/>
  </g>
  <!-- worktop (muted so it doesn't read as a pale stripe under the dark text overlay) -->
  <rect x="40" y="330" width="1520" height="20" fill="#4A5A7D"/>
  <!-- pendant lights -->
  <g stroke="#D9BE8C" stroke-width="2">
    <line x1="450" y1="0" x2="450" y2="150"/>
    <circle cx="450" cy="185" r="34" fill="#0D1730" stroke="#D9BE8C"/>
    <line x1="900" y1="0" x2="900" y2="180"/>
    <circle cx="900" cy="215" r="34" fill="#0D1730" stroke="#D9BE8C"/>
    <line x1="1180" y1="0" x2="1180" y2="130"/>
    <circle cx="1180" cy="165" r="34" fill="#0D1730" stroke="#D9BE8C"/>
  </g>
  <rect x="24" y="924" width="430" height="44" rx="4" fill="#0D1730" opacity="0.55"/>
  <text x="42" y="952" font-family="Inter, sans-serif" font-size="20" fill="#D9BE8C">Placeholder photo — real install photo to follow</text>
</svg>
